<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Forum&display=swap" rel="stylesheet">
    <title>cssMemeSlider</title>
    <link rel="stylesheet" href="./css/normalize.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <div class="container">

        <input type="radio" name="point" id="slide1" checked>
        <input type="radio" name="point" id="slide2">
        <input type="radio" name="point" id="slide3">
        <input type="radio" name="point" id="slide4">
        <input type="radio" name="point" id="slide5">

        <div class="slider">
            
            <div class="slides slide1">
                <!-- <img src="./images/01_Oh-hi-Final-1.jpg" alt="cat and couch"> -->
                <img src="./images/01.jpg" alt="01">                
            </div>

            <div class="slides slide2">
                <!-- <img src="./images/02_5-mins-into-the-movie-Final-1.jpg" alt="cat on the chair"> -->
                <img src="./images/02.jpg" alt="02">
            </div>

            <div class="slides slide3">
                <!-- <img src="./images/03_Computer-heat-Final-1.jpg" alt="cat and computer"> -->
                <img src="./images/03.jpg" alt="03">
            </div>

            <div class="slides slide4">
                <!-- <img src="./images/04_inandout.jpg" alt="cat go to outside"> -->
                <img src="./images/04.jpg" alt="04">
            </div>

            <div class="slides slide5">
                <!-- <img src="./images/05_when-your-human-doesn-t-like-the-dead-bird.jpg" alt="cat is crying"> -->
                <img src="./images/05.jpg" alt="05">
            </div>

        </div>

        <div class="description-and-controls">

            <div class="description">
                <p class="slogans slogan-1">Cat's greetings</p>
                <p class="slogans slogan-2">Cat's awakening</p>
                <p class="slogans slogan-3">Cat's little pleasures</p>
                <p class="slogans slogan-4">Cat's contradiction</p>
                <p class="slogans slogan-5">Cat's amazement</p>
            </div>

            <div class="controls">
                
                <label class="button-wrapper" for="slide1">
                    <div class="button1">                                        
                    </div>
                </label>
                <label class="button-wrapper" for="slide2">
                    <div class="button2">                                        
                    </div>
                </label>
                <label class="button-wrapper" for="slide3">
                    <div class="button3">                                        
                    </div>
                </label>
                <label class="button-wrapper" for="slide4">
                    <div class="button4">                                        
                    </div>
                </label>
                <label class="button-wrapper" for="slide5">
                    <div class="button5">
                    </div>
                </label>           

            </div>                

        </div>


    </div>

</body>
